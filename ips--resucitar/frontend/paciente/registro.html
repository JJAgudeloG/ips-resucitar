<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IPS Resucitar - Crear Cuenta</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <a href="../index.html" class="link-inicio">← Volver al inicio</a>

    <div class="contenedor-formulario">
        <h1>Crear Cuenta</h1>

        <form id="formRegistro">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required>

            <label for="documento">Documento</label>
            <input type="text" id="documento" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required minlength="6">

            <button type="submit">Registrarme</button>
        </form>

        <p id="mensajeRegistro"></p>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pacienteAuth.js"></script>
</body>
</html>
